# ─────────────────────────────────────────────────────────────────────────────
# Intercom media (WIP): RTP / L16 / 16 kHz mono over UDP ${intercom_port}.
#   • mic → door while the key is held (push-to-talk), door → speaker otherwise
#   • peer is latched from the first stream that arrives during a call, or set via
#     the `set_intercom_peer` action (HA / door station)
#   • outside a call every incoming packet is dropped unheard (no LAN device can play
#     sound in a bedroom). Still: keep RoomKeys in the IoT VLAN, like the door devices.
#   • "Transcriber address" (host:port, empty = off): while the key transmits, a copy of its
#     mic stream also goes to the local transcriber (who is speaking + text for the door screen)
# Signalling stays in HA (events answer / talk_* / hangup, action call_state).
# See docs/intercom-protocol.md.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  intercom_port: "5004"
  front_door_entity: binary_sensor.aikos_front_door     # aikos: front door open (debounced)
  quiet_hours_entity: binary_sensor.aikos_quiet_hours   # aikos: quiet hours now

esphome:
  includes:
    - src/roomkey_dsp.h
    - src/roomkey_audio.h
  on_boot:
    - priority: -170
      then:
        - lambda: |-
            auto &c = roomkey::ctl();
            auto prev_talk = c.hooks.talk;
            c.hooks.talk = [prev_talk](bool on) {
              if (prev_talk) prev_talk(on);
              roomkey::audio().set_tx(on);
            };
            auto prev_hangup = c.hooks.hangup;
            c.hooks.hangup = [prev_hangup]() {
              if (prev_hangup) prev_hangup();
              roomkey::audio().end_session();
            };

script:
  - id: rk_apply_door
    then:
      - lambda: |-
          const std::string &d = id(door_address).state;
          size_t p = d.rfind(':');
          if (p != std::string::npos && p > 0 && roomkey::audio().active())
            roomkey::audio().set_peer(d.substr(0, p), (uint16_t) atoi(d.c_str() + p + 1));

api:
  actions:
    - action: set_intercom_peer
      variables:
        peer_host: string
        peer_port: int
      then:
        - lambda: roomkey::audio().set_peer(peer_host, peer_port);

interval:
  - interval: 10ms
    then:
      - lambda: |-
          auto &a = roomkey::audio();
          auto &c = roomkey::ctl();
          if (!a.active()) {
            if (network::is_connected() && a.begin(${intercom_port})) {
              a.set_tap(id(transcriber).state);
              id(rk_apply_door).execute();
            }
          } else {
            // audio in only during a call, or before an answer if this room wants to hear the visitor (R17.13)
            a.set_accept(c.in_call() || (c.ringing() && id(rk_hear_before_now).state));
            a.loop();
            if (c.in_call()) c.set_level(a.rx_level);
            else if (a.tx() && !c.test_recording()) a.end_session();   // call ended elsewhere (door hung up)
          }
          // push-to-talk only (owner, 30.09.): no hang-up. R17.8 (also without network): a call ends after
          // "Call silence end" seconds without SPEECH either way (the v2 door mic sends all call long, so
          // packets don't count), or at "Call max length" (safety net).
          static bool was_in_call = false;
          static uint32_t speech_ms = 0, text_n = 0;
          const uint32_t now = millis();
          if (c.in_call() && !was_in_call) a.touch(), speech_ms = now;
          was_in_call = c.in_call();
          if (c.talking()) speech_ms = now;
          if (a.rx_gate.voiced_since(speech_ms)) speech_ms = a.rx_gate.last_voice_ms();
          if (c.visitor_text_count() != text_n) text_n = c.visitor_text_count(), speech_ms = now;   // new words = speech
          c.cfg.call_max_ms = (uint32_t) id(rk_call_max).state * 1000;
          if (c.in_call() && !c.talking() && now - speech_ms > (uint32_t) id(rk_call_silence).state * 1000) {
            ESP_LOGI("roomkey.call", "no speech for %.0f s: call over", id(rk_call_silence).state);
            c.call_state("ended");
          }

# ── Call settings of this key (voice v2, aikos features/sprechen.md §4b B; kept in flash, work without HA) ──
switch:
  - platform: template
    id: rk_hear_before
    name: "Hear visitor before answer"     # R17.13: the visitor's voice already plays here before anyone answers
    icon: mdi:account-voice
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: rk_door_ends_call
    name: "Front door ends call"           # R17.8: opening the front door ends this key's call
    icon: mdi:door-open
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

datetime:
  - platform: template
    id: rk_hear_from
    type: time
    name: "Hear visitor from"              # time window for "Hear visitor before answer"; from = until: always
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
  - platform: template
    id: rk_hear_until
    type: time
    name: "Hear visitor until"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"

number:
  - platform: template
    id: rk_call_silence
    name: "Call silence end"               # seconds without speech either way until the call ends (R17.8)
    icon: mdi:timer-sand
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 3
    max_value: 120
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
  - platform: template
    id: rk_call_max
    name: "Call max length"                # safety net if noise looks like speech
    icon: mdi:timer-off-outline
    entity_category: config
    unit_of_measurement: s
    mode: box
    min_value: 30
    max_value: 1800
    step: 10
    initial_value: 300
    optimistic: true
    restore_value: true

binary_sensor:
  # Front door from aikos: only the edge closed → open counts (a door left open ends nothing more)
  - platform: homeassistant
    id: rk_front_door
    entity_id: ${front_door_entity}
    internal: true
    on_state:
      - lambda: |-
          static int prev = -1;              // the value HA reports at connect arrives without on_state
          if (x && prev != 1 && id(rk_door_ends_call).state && roomkey::ctl().in_call()) {
            ESP_LOGI("roomkey.call", "front door opened: call over");
            roomkey::ctl().call_state("ended");
          }
          prev = x ? 1 : 0;
  - platform: homeassistant
    id: rk_quiet_hours
    entity_id: ${quiet_hours_entity}
    internal: true
  # Visitor audio may play now (before an answer): switch on, inside the time window, and outside the quiet
  # hours unless it is an emergency (R17.13, R17.15). Without a valid clock only "always" (from = until) counts.
  - platform: template
    id: rk_hear_before_now
    internal: true
    lambda: |-
      if (!id(rk_hear_before).state) return false;
      if (id(rk_quiet_hours).has_state() && id(rk_quiet_hours).state && !roomkey::ctl().visitor_urgent()) return false;
      int from = id(rk_hear_from).hour * 60 + id(rk_hear_from).minute;
      int until = id(rk_hear_until).hour * 60 + id(rk_hear_until).minute;
      if (from == until) return true;
      auto t = id(rk_time).now();
      if (!t.is_valid()) return false;
      int m = t.hour * 60 + t.minute;
      return from < until ? (m >= from && m < until) : (m >= from || m < until);

text:
  # Where the door talk computer listens (host:port). Holding the key talks to it even without a ring;
  # a ring sets the same peer through HA anyway. Empty = only after a ring.
  - platform: template
    id: door_address
    name: "Door address"
    icon: mdi:door
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64
    on_value:
      - script.execute: rk_apply_door
  - platform: template
    id: transcriber
    name: "Transcriber address"
    icon: mdi:text-to-speech
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64
    on_value:
      - lambda: roomkey::audio().set_tap(x);

sensor:
  - platform: template
    name: "Intercom RX packets"
    id: intercom_rx
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return roomkey::audio().rx_pkts;
  - platform: template
    name: "Intercom TX packets"
    id: intercom_tx
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return roomkey::audio().tx_pkts;
  - platform: template
    name: "Intercom TX errors"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return roomkey::audio().tx_err + roomkey::audio().overruns;
