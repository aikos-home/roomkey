# ─────────────────────────────────────────────────────────────────────────────
# Networking for real hardware — the usual ESPHome way: Wi-Fi from secrets.yaml
# (wifi_ssid / wifi_password, gitignored, never in the repo; 2.4 GHz only).
# Fallbacks if that network is unreachable: the hotspot "RoomKey <room>"
# (password: ap_password secret) with a captive portal, and Improv over USB.
# ─────────────────────────────────────────────────────────────────────────────

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  power_save_mode: none   # lowest latency for ring / talk
  ap:
    ssid: "aikos RoomKey ${room_name}"
    password: !secret ap_password

captive_portal:

improv_serial:

time:
  - platform: sntp
    id: rk_time
    timezone: ${timezone}

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi signal"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP address"
      entity_category: diagnostic

interval:
  - interval: 10s
    then:
      - lambda: |-
          float r = id(wifi_rssi).state;
          roomkey::ctl().set_net(id(wifi_ip).state, std::isnan(r) ? 0 : (int) r);
