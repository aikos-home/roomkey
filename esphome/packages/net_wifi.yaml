# ─────────────────────────────────────────────────────────────────────────────
# Networking for real hardware.
# No Wi-Fi credentials are baked in: provision once via
#   • Improv over USB  → https://web.esphome.io  → "Connect" → Wi-Fi, or
#   • the fallback hotspot "RoomKey <room>" (password: ap_password secret).
# To hardcode instead, add  ssid: !secret wifi_ssid / password: !secret wifi_password
# ─────────────────────────────────────────────────────────────────────────────

wifi:
  power_save_mode: none   # lowest latency for ring / talk
  ap:
    ssid: "RoomKey ${room_name}"
    password: !secret ap_password

captive_portal:

improv_serial:

time:
  - platform: sntp
    id: rk_time
    timezone: ${timezone}

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi signal"
    entity_category: diagnostic
    update_interval: 30s

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP address"
      entity_category: diagnostic

interval:
  - interval: 10s
    then:
      - lambda: |-
          float r = id(wifi_rssi).state;
          roomkey::ctl().set_net(id(wifi_ip).state, std::isnan(r) ? 0 : (int) r);
