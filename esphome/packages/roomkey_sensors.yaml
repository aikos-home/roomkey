# ─────────────────────────────────────────────────────────────────────────────
# Room sensors (WIP · untested on hardware): climate, presence. Arrived 02.10., first on the touch board.
# No light sensor: the RoomKey doesn't get one (decided 06.10.).
#   SHT31-D   climate     I²C 0x44   VIN→3V3  GND  SDA  SCL       ADR open; room air, away from the ESP and the amp
#   LD2410C   presence    UART 256000  VCC→5V  GND  TX→${radar_rx}  RX←${radar_tx}   not behind metal
# The I²C sensor shares the board's bus `bus_i2c` (touch 0x63, IMU 0x6B: no clash). Pins: the board package.
# ─────────────────────────────────────────────────────────────────────────────

uart:
  - id: radar_uart
    rx_pin: ${radar_rx}
    tx_pin: ${radar_tx}
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

ld2410:
  id: radar
  uart_id: radar_uart

sensor:
  - platform: sht3xd
    i2c_id: bus_i2c
    address: 0x44
    update_interval: 30s
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
  - platform: ld2410
    ld2410_id: radar
    detection_distance:
      name: "Presence distance"

binary_sensor:
  - platform: ld2410
    ld2410_id: radar
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Presence moving"
    has_still_target:
      name: "Presence still"
