# ─────────────────────────────────────────────────────────────────────────────
# Microphone: INMP441 I²S MEMS mic (bottom port — the PCB hole faces the room).
#   INMP441  VDD→3V3  GND→GND  SCK→${i2s_bclk}  WS→${i2s_lrclk}  SD→${i2s_din}
#            L/R→GND (left channel): to a GND pin (touch board), or a GPIO held LOW (desk board, its package)
# Captures only while "Room info" is open (live dBFS meter) or while talking;
# while talking the samples also go to the intercom link (roomkey_intercom.yaml).
# Verified 2026-09-29: 1 kHz test beep 30 dB over the room floor, speech +18 dB.
# The I²S bus is shared with the speaker amp later (half-duplex by design).
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  mic_gain: "2.0"   # digital gain into the intercom stream (×2 ≈ +6 dB; ×4 clipped loud speech, Whisper needs no more)

esphome:
  includes:
    - src/roomkey_dsp.h
    - src/roomkey_audio.h
  on_boot:
    - priority: -160
      then:
        - lambda: |-
            roomkey::ctl().hooks.mic = [](bool on) {
              if (on) {
                id(mic_session) += 1;   // on_data resets its filters and mutes the start-up pop
                id(mic).start();
              } else {
                id(mic).stop();
                roomkey::ctl().set_mic_level(-1.0f, -120.0f);
              }
            };

globals:
  - id: mic_session
    type: uint32_t
    initial_value: "0"
  - id: rk_mic_db                      # the last block's level (dBFS), written by the mic's on_data
    type: float
    initial_value: "-120"
  - id: rk_mic_test_until              # mic test (action mic_test): millis() when it ends, 0 = none
    type: uint32_t
    initial_value: "0"

# Mic test for hardware bring-up: the mic runs for some seconds (the screen says so), nothing is sent anywhere (no call,
# no transcriber); "Mic level" (dBFS) once a second. Quiet room ≈ −60, music or speech nearby ≈ −40 … −20.
api:
  actions:
    - action: mic_test
      variables:
        seconds: int
      then:
        - lambda: |-
            const int s = seconds < 1 ? 1 : (seconds > 60 ? 60 : seconds);
            id(rk_mic_test_until) = millis() + s * 1000;
            roomkey::ctl().set_test_recording(true, s);

sensor:
  - platform: template
    id: rk_mic_level
    name: "Mic level"
    icon: mdi:microphone
    unit_of_measurement: dBFS
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(rk_mic_test_until) == 0) return;
          id(rk_mic_level).publish_state(id(rk_mic_db));
          if ((int32_t) (millis() - id(rk_mic_test_until)) >= 0) {
            id(rk_mic_test_until) = 0;
            roomkey::ctl().set_test_recording(false);
          }

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: ${i2s_din}
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true
    on_data:
      - lambda: |-
          // x = little-endian int32 (Q31) samples. Runs in the mic task: compute, store, return.
          // 120 Hz high-pass first: kills table knocks / handling rumble (measured +43 dB
          // below 80 Hz on loose wires) without touching the speech band.
          static roomkey::Biquad hp = roomkey::Biquad::highpass(120.0f, 16000.0f);
          static roomkey::Limiter lim;
          static uint32_t session = 0, mute = 0;
          if (session != id(mic_session)) {   // a fresh start: old filter state + the INMP441's power-up step = a pop
            session = id(mic_session);
            hp = roomkey::Biquad::highpass(120.0f, 16000.0f);
            lim = roomkey::Limiter();
            mute = 512;                        // 32 ms
          }
          const float gain = ${mic_gain};
          const int32_t *s = reinterpret_cast<const int32_t *>(x.data());
          size_t n = x.size() / 4;
          float acc = 0;
          int16_t out[512];
          size_t done = 0;
          while (done < n) {
            size_t k = n - done < 512 ? n - done : 512;
            for (size_t i = 0; i < k; i++) {
              float y = hp.process(s[done + i] * (1.0f / 2147483648.0f));
              if (mute) { mute--; y = 0.0f; }
              acc += y * y;
              float v = lim.process(y * gain * 32768.0f);
              out[i] = (int16_t) (v > 32767.f ? 32767 : (v < -32768.f ? -32768 : v));
            }
            if (roomkey::audio().active()) roomkey::audio().push_s16(out, k);   // no-op unless talking
            done += k;
          }
          if (n == 0) return;
          float db = 10.0f * log10f(acc / n + 1e-12f);
          roomkey::audio().note_level(db);   // end-of-speech detection (timed test recordings)
          float lvl = (db + 65.0f) / 50.0f;   // −65 dBFS → 0 … −15 dBFS → 1
          lvl = lvl < 0 ? 0 : (lvl > 1 ? 1 : lvl);
          static float smooth = 0;
          smooth = lvl > smooth ? lvl : smooth * 0.88f + lvl * 0.12f;   // fast attack, slow release
          roomkey::ctl().set_mic_level(smooth, db);
          id(rk_mic_db) = db;                // for "Mic level" (published from the main loop)
