# ─────────────────────────────────────────────────────────────────────────────
# RoomKey ⇄ Home Assistant contract
#
#   Subscribes to   ${light_entity}     → lights on/off on the home screen
#                   ${alarm_entity}     → armed banner, entry-delay / alarm takeover
#                   ${doorbell_entity}  → ring (optional; HA can also call `ring`)
#   Calls           light.toggle ${light_entity}
#                   ${disarm_action}  (data: room, entity_id) — policy lives in HA
#   Fires event     esphome.roomkey  {room, node, type: answer|dismiss|hangup|
#                                     call_door|talk_start|talk_stop}
#   Offers actions  ring · ring_stop · call_state(state) · show_toast(message)
#                   simulate_alarm(state) · simulate_lights(lights_on) · simulate_key(hold_ms)
#
# Needs "Allow the device to perform Home Assistant actions" enabled on the
# ESPHome integration entry in HA. See homeassistant/roomkey_package.yaml.
# ─────────────────────────────────────────────────────────────────────────────

esphome:
  on_boot:
    - priority: -150   # after the UI is built (core runs at -100)
      then:
        - lambda: |-
            auto &c = roomkey::ctl();
            c.set_demo(id(demo_mode).state);
            c.hooks.toggle_lights = []() { id(ha_toggle_lights).execute(); };
            c.hooks.disarm = []() { id(ha_disarm).execute(); };
            c.hooks.answer = []() { id(ha_event).execute(std::string("answer")); };
            c.hooks.dismiss = []() { id(ha_event).execute(std::string("dismiss")); };
            c.hooks.call_door = []() { id(ha_event).execute(std::string("call_door")); };
            c.hooks.hangup = []() { id(ha_event).execute(std::string("hangup")); };
            auto prev_talk = c.hooks.talk;
            c.hooks.talk = [prev_talk](bool on) {
              if (prev_talk) prev_talk(on);
              if (!roomkey::ctl().cfg.demo) id(ha_event).execute(std::string(on ? "talk_start" : "talk_stop"));
            };

substitutions:
  visitor_entity: sensor.talk_transcript_door   # device files may override
  visitor_language_attr: language_name_en        # language_name = German names (for language: de)
  live_entity: sensor.talk_live_door             # partial text while the visitor talks
  call_log_entity: sensor.aikos_call_log         # the conversation as a chat (aikos; tests: sensor.aikos_call_log_test)

api:
  encryption:
    key: !secret api_key
  # No reboot when Home Assistant is away: the key must keep working (local demo,
  # HA maintenance). ESPHome's default would restart it every 15 min without a client.
  reboot_timeout: 0s
  actions:
    - action: ring
      then:
        - lambda: roomkey::ctl().ring_start();
    - action: ring_stop
      then:
        - lambda: roomkey::ctl().ring_stop();
    - action: call_state
      variables:
        state: string
      then:
        - lambda: roomkey::ctl().call_state(state);
    - action: show_toast
      variables:
        message: string
      then:
        - lambda: roomkey::ctl().toast(message, 2500);
    - action: simulate_alarm
      variables:
        state: string
      then:
        - lambda: roomkey::ctl().set_alarm(roomkey::parse_alarm(state));
    - action: simulate_key          # press (short) or hold the key remotely — for tests
      variables:
        hold_ms: int
      then:
        - lambda: roomkey::ctl().key(true);
        - delay: !lambda return hold_ms;
        - lambda: roomkey::ctl().key(false);
    - action: simulate_lights
      variables:
        lights_on: bool
      then:
        - lambda: "roomkey::ctl().set_lights(lights_on ? 1 : 0);"

interval:
  - interval: 2s
    then:
      - lambda: roomkey::ctl().set_online(api::global_api_server->is_connected_with_state_subscription());

switch:
  - platform: template
    id: demo_mode
    name: "Demo mode"
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON   # on until the rest of the system exists
    on_turn_on:
      - lambda: roomkey::ctl().set_demo(true);
    on_turn_off:
      - lambda: |-
          auto &c = roomkey::ctl();
          c.set_demo(false);
          c.set_lights_state(id(ha_light_state).state);
          c.set_alarm_state(id(ha_alarm_state).state);

json:

text_sensor:
  # The conversation as a chat (R17.6): aikos keeps the log, the key only draws it (the one source for both screens).
  - platform: homeassistant
    id: ha_call_log
    entity_id: ${call_log_entity}
    attribute: messages_json
    internal: true
    on_value:
      - lambda: |-
          std::vector<roomkey::Controller::ChatMsg> msgs;
          if (!x.empty() && x[0] == '[') {
            JsonDocument doc = json::parse_json(x);
            for (JsonObject m : doc.as<JsonArray>()) {
              roomkey::Controller::ChatMsg c;
              c.id = (const char *) (m["id"] | "");
              c.who = (const char *) (m["who"] | "");
              c.role = (const char *) (m["role"] | "");
              c.text = (const char *) (m["text"] | "");
              c.lang = (const char *) (m["lang"] | "");
              c.door = std::string((const char *) (m["side"] | "")) == "door";
              c.urgent = m["urgent"] | false;
              c.identified = std::string((const char *) (m["spk"] | "")) != "" || (m["sticky"] | false);   // R25
              if (!c.text.empty()) msgs.push_back(std::move(c));
            }
          }
          roomkey::ctl().set_chat(std::move(msgs));
  # R22: the chat counts only while the call log says a call is active (never the last call's chat)
  - platform: homeassistant
    id: ha_call_log_active
    entity_id: ${call_log_entity}
    attribute: active
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_chat_active(x == "True" || x == "true" || x == "on");
  # Who is at the door, as the visitor introduced themselves (door-side transcript, aikos vertraege.md §6).
  - platform: homeassistant
    id: ha_visitor
    entity_id: ${visitor_entity}
    attribute: speaker
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor(x);
  - platform: homeassistant
    id: ha_visitor_language
    entity_id: ${visitor_entity}
    attribute: ${visitor_language_attr}
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor_language(x);
  # Visitor type for the icon (parcel, police, name, …) and the emergency flag (voice v2, aikos features/sprechen.md §2c).
  - platform: homeassistant
    id: ha_visitor_role
    entity_id: ${visitor_entity}
    attribute: speaker_role
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor_role(x);
  - platform: homeassistant
    id: ha_visitor_urgent
    entity_id: ${visitor_entity}
    attribute: urgent
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor_urgent(x);
  # What the visitor is saying, live (partial texts while they hold the door's talk button), then the final transcript.
  - platform: homeassistant
    id: ha_live_text
    entity_id: ${live_entity}
    attribute: text
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_live_text(x);
  - platform: homeassistant
    id: ha_live_started             # state = when this utterance started: a new one types in from the start
    entity_id: ${live_entity}
    internal: true
    on_value:
      - lambda: roomkey::ctl().live_utterance(x);
  - platform: homeassistant
    id: ha_live_speaker
    entity_id: ${live_entity}
    attribute: speaker
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor(x);
  - platform: homeassistant
    id: ha_live_role
    entity_id: ${live_entity}
    attribute: speaker_role
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor_role(x);
  - platform: homeassistant
    id: ha_live_urgent
    entity_id: ${live_entity}
    attribute: urgent
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_visitor_urgent(x);
  - platform: homeassistant
    id: ha_visitor_text
    entity_id: ${visitor_entity}
    attribute: text
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_live_text(x);
  # HA only sends an attribute when it CHANGES — the same visitor or language twice would be missed. The state (a
  # timestamp) changes with every transcript: then re-apply the last values (after the attributes had time to arrive).
  - platform: homeassistant
    id: ha_visitor_stamp
    entity_id: ${visitor_entity}
    internal: true
    on_value:
      - script.execute: rk_apply_visitor
  - platform: homeassistant
    id: ha_alarm_state
    entity_id: ${alarm_entity}
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_alarm_state(x);
  - platform: homeassistant
    id: ha_light_state
    entity_id: ${light_entity}
    internal: true
    on_value:
      - lambda: roomkey::ctl().set_lights_state(x);

binary_sensor:
  - platform: homeassistant
    id: ha_doorbell
    entity_id: ${doorbell_entity}
    internal: true
    on_press:   # every off→on rings — no cooldown (storm ringing ≈ 6 presses/s must all arrive)
      - lambda: |-
          id(doorbell_rx_count) += 1;
          ESP_LOGI("roomkey", "doorbell press #%u received from HA", (unsigned) id(doorbell_rx_count));
          id(doorbell_ha_ms) = millis();
          // the direct path (roomkey_link.yaml) may have rung this press already: don't ring a dismissed ring again
          if (millis() - id(doorbell_direct_ms) < 1500 && id(doorbell_direct_ms) != 0) return;
          roomkey::ctl().ring_start();
      - component.update: doorbell_rx_sensor

globals:
  - id: doorbell_rx_count
    type: uint32_t
    initial_value: "0"
  - id: doorbell_ha_ms                  # when HA last delivered a press (the direct path skips the same press)
    type: uint32_t
    initial_value: "0"
  - id: doorbell_direct_ms              # when the direct ring path (roomkey_link.yaml) last rang; 0 = never
    type: uint32_t
    initial_value: "0"

sensor:
  # Compare with the bell's presses_since_boot during a storm test: equal = nothing lost on the
  # HA → key path.
  - platform: template
    id: doorbell_rx_sensor
    name: "Doorbell presses received"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: never
    lambda: return id(doorbell_rx_count);

script:
  - id: rk_apply_visitor
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          roomkey::ctl().set_visitor(id(ha_visitor).state);
          roomkey::ctl().set_visitor_language(id(ha_visitor_language).state);
          roomkey::ctl().set_visitor_role(id(ha_visitor_role).state);
          roomkey::ctl().set_visitor_urgent(id(ha_visitor_urgent).state);
  - id: ha_toggle_lights
    then:
      - homeassistant.action:
          action: light.toggle
          data:
            entity_id: ${light_entity}
  - id: ha_disarm
    then:
      - homeassistant.action:
          action: ${disarm_action}
          data:
            room: ${room_name}
            entity_id: ${alarm_entity}
  - id: ha_event
    mode: queued
    parameters:
      kind: string
    then:
      - homeassistant.event:
          event: esphome.roomkey
          data:
            room: ${room_name}
            node: ${node_name}
            type: !lambda return kind;
