# ─────────────────────────────────────────────────────────────────────────────
# TEST ONLY (WIP) — record 10 s of the room microphone after every ring.
#
# Prototype for the talk path: after a ring, the key streams its microphone for 10 s
# as RTP L16 16 kHz (the intercom format) to "Test recorder address" (host:port),
# where tools/rtp_recorder.py saves it as WAV. Off by default; the screen says when
# the microphone is on. Remove this package once the real talk function exists.
# Needs roomkey_mic.yaml + roomkey_intercom.yaml.
# ─────────────────────────────────────────────────────────────────────────────

switch:
  - platform: template
    id: test_record_after_ring
    name: "TEST record 10 s after ring"
    icon: mdi:record-rec
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

text:
  - platform: template
    id: test_recorder
    name: "TEST recorder address"
    icon: mdi:ip-network
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64

script:
  - id: rk_test_record
    mode: single            # storm ringing doesn't restart a running test
    then:
      - if:
          condition:
            lambda: |-
              const std::string &t = id(test_recorder).state;
              return id(test_record_after_ring).state && roomkey::audio().active() && t.find(':') != std::string::npos;
          then:
            - lambda: |-
                const std::string &t = id(test_recorder).state;
                size_t p = t.rfind(':');
                roomkey::audio().set_peer(t.substr(0, p), (uint16_t) atoi(t.c_str() + p + 1));
                roomkey::ctl().set_test_recording(true);     // mic on + on-screen notice
                roomkey::audio().set_tx(true);
                ESP_LOGI("roomkey.test", "TEST recording 10 s → %s", t.c_str());
            - delay: 10s
            - lambda: |-
                roomkey::audio().set_tx(false);
                roomkey::ctl().set_test_recording(false);
                roomkey::audio().clear_peer();
                ESP_LOGI("roomkey.test", "TEST recording done (%u packets sent in total)", (unsigned) roomkey::audio().tx_pkts);

esphome:
  on_boot:
    - priority: -190     # wraps whatever ringtone hook the speaker package set
      then:
        - lambda: |-
            auto &c = roomkey::ctl();
            auto prev = c.hooks.ringtone;
            c.hooks.ringtone = [prev](bool on) {
              if (prev) prev(on);
              if (on) id(rk_test_record).execute();
            };
