# ── LVGL: one empty screen; the controller builds the UI on it ───────────────
lvgl:
  displays: [lcd]
  buffer_size: ${lvgl_buffer}
  log_level: WARN
  pages:
    - id: rk_page
      bg_color: 0x0A0C0F
      scrollable: false
      widgets:   # declared so ESPHome compiles these LVGL widget types in
        - label: {id: rk_dummy_label, hidden: true, text: " ", text_font: f_small}
        - arc: {id: rk_dummy_arc, hidden: true}
