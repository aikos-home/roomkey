# Desktop simulator — same UI + HA contract, SDL window instead of hardware.
#   esphome compile sim.yaml && .esphome/build/roomkey-sim/.pioenvs/roomkey-sim/program
#   SPACE = mechanical key · mouse = touch
substitutions:
  node_name: roomkey-sim
  room_name: Office
  door_name: Front door
  language: en
  timezone: Europe/Berlin
  light_entity: light.all_lights
  alarm_entity: alarm_control_panel.house
  doorbell_entity: binary_sensor.doorbell_button
  visitor_entity: sensor.talk_transcript_door    # who is at the door (transcript attribute "speaker")
  disarm_action: script.roomkey_disarm
  aikos_voice_ref: voice-v2.1.0                  # push_samples() (host support) since this tag

esphome:
  name: ${node_name}
  friendly_name: RoomKey Simulator

packages:
  board: !include packages/board_sim.yaml
  core: !include packages/roomkey_core.yaml
  ha: !include packages/roomkey_ha.yaml
  voice: !include packages/roomkey_voice.yaml       # voice v2: the shared aikos_voice building block (room role)
  sim_mic: !include packages/sim_voice_v2.yaml      # its "mic": a synthetic voice through push_samples()
  call: !include packages/roomkey_call.yaml        # call settings, front door, door + transcriber address
  link: !include packages/roomkey_link.yaml       # key_state ⇄ door, direct ring path from the bell (system test F3)

logger:
  level: DEBUG
  logs:
    lvgl: INFO
