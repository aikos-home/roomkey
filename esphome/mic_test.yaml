# Microphone bring-up (dev tool): no UI, no Wi-Fi — mic on at boot, levels logged,
# 5 s clip recorded ~6 s after boot and dumped over USB as base64.
# Host side: tools/mic_check.py (flashes nothing; just resets, listens, plays a test sound).
substitutions:
  node_name: roomkey-mictest

esphome:
  name: ${node_name}
  includes:
    - src/mic_test.h
  on_boot:
    - priority: -100
      then:
        - lambda: id(mic).start();

packages:
  board: !include packages/board_c6_lcd_147.yaml

switch:
  - platform: gpio
    id: mic_lr_select
    pin: ${mic_lr}
    internal: true
    restore_mode: ALWAYS_OFF   # LOW → left channel

logger:
  level: INFO
  tx_buffer_size: 1024

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: ${i2s_lrclk}
    i2s_bclk_pin: ${i2s_bclk}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: ${i2s_din}
    adc_type: external
    pdm: false
    channel: left
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true
    on_data:
      - lambda: mictest::on_data(x);

interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (mictest::g_state == mictest::WARMUP || mictest::g_state == mictest::CAPTURING) mictest::report();
          if (mictest::g_state == mictest::WARMUP && millis() > 7000) mictest::start_capture();
  - interval: 10ms
    then:
      - lambda: mictest::dump_some();
