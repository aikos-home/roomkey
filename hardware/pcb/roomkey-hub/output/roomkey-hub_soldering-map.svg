22" font-weight="bold" transform="rotate(60 1159.5 606.5)" text-anchor="start">“GND”</text><circle cx="1159.5" cy="543.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1159.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">12</text><text x="1159.5" y="513.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(-60 1159.5 513.5)" text-anchor="start">“TXD”</text><circle cx="1192.6" cy="576.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1192.6" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">13</text><text x="1192.6" y="606.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(60 1192.6 606.5)" text-anchor="start">“7”</text><circle cx="1192.6" cy="543.5" r="11" fill="#222222" stroke="#000" stroke-width="1.5"/><text x="1192.6" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">14</text><text x="1192.6" y="513.5" font-size="17" fill="#222222" font-weight="bold" transform="rotate(-60 1192.6 513.5)" text-anchor="start">“GND”</text><circle cx="1225.6" cy="576.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1225.6" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">15</text><text x="1225.6" y="606.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(60 1225.6 606.5)" text-anchor="start">“8”</text><circle cx="1225.6" cy="543.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1225.6" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">16</text><text x="1225.6" y="513.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(-60 1225.6 513.5)" text-anchor="start">“RXD”</text><text x="30" y="870" font-size="18" font-weight="bold" fill="#111">Notes</text><text x="30" y="898" font-size="16" fill="#333">“GND”: the touch board has three GND pads — one wire from each, into any GND hole.</text><text x="30" y="923" font-size="16" fill="#333">“VBUS”: one wire is enough (the second VBUS hole is a spare). Square hole = position 1.</text><text x="30" y="948" font-size="16" fill="#333">Positions 5 and 6 stay empty: the bottom key (“6”) goes to J10, the LED data (“4”) to J11.</text><text x="30" y="973" font-size="16" fill="#333">Never connect anything to the touch board's 3V3, VBAT, RST, 1, 2, 12, 13 pads.</text><text x="30" y="998" font-size="16" fill="#333">Where each named pad sits on the touch board: docs/wiring-touch-board.md (the kit uses the same pads).</text></svg>