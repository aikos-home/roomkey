”</text><circle cx="1027.5" cy="543.5" r="11" fill="#d35400" stroke="#000" stroke-width="1.5"/><text x="1027.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">4</text><text x="1027.5" y="513.5" font-size="17" fill="#d35400" font-weight="bold" transform="rotate(-60 1027.5 513.5)" text-anchor="start">“9”</text><circle cx="1060.5" cy="576.5" r="11" fill="#d35400" stroke="#000" stroke-width="1.5"/><text x="1060.5" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="1060.5" y="606.5" font-size="17" fill="#d35400" font-weight="bold" transform="rotate(60 1060.5 606.5)" text-anchor="start">“6”</text><circle cx="1060.5" cy="543.5" r="11" fill="#0f9fb0" stroke="#000" stroke-width="1.5"/><text x="1060.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">6</text><text x="1060.5" y="513.5" font-size="17" fill="#0f9fb0" font-weight="bold" transform="rotate(-60 1060.5 513.5)" text-anchor="start">“4”</text><circle cx="1093.5" cy="576.5" r="11" fill="#8e44ad" stroke="#000" stroke-width="1.5"/><text x="1093.5" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">7</text><text x="1093.5" y="606.5" font-size="17" fill="#8e44ad" font-weight="bold" transform="rotate(60 1093.5 606.5)" text-anchor="start">“5”</text><circle cx="1093.5" cy="543.5" r="11" fill="#8e44ad" stroke="#000" stroke-width="1.5"/><text x="1093.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">8</text><text x="1093.5" y="513.5" font-size="17" fill="#8e44ad" font-weight="bold" transform="rotate(-60 1093.5 513.5)" text-anchor="start">“3”</text><circle cx="1126.5" cy="576.5" r="11" fill="#1e9e6a" stroke="#000" stroke-width="1.5"/><text x="1126.5" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">9</text><text x="1126.5" y="606.5" font-size="17" fill="#1e9e6a" font-weight="bold" transform="rotate(60 1126.5 606.5)" text-anchor="start">“SDA”</text><circle cx="1126.5" cy="543.5" r="11" fill="#1e9e6a" stroke="#000" stroke-width="1.5"/><text x="1126.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">10</text><text x="1126.5" y="513.5" font-size="17" fill="#1e9e6a" font-weight="bold" transform="rotate(-60 1126.5 513.5)" text-anchor="start">“SCL”</text><circle cx="1159.5" cy="576.5" r="11" fill="#222222" stroke="#000" stroke-width="1.5"/><text x="1159.5" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">11</text><text x="1159.5" y="606.5" font-size="17" fill="#222222" font-weight="bold" transform="rotate(60 1159.5 606.5)" text-anchor="start">“GND”</text><circle cx="1159.5" cy="543.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1159.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">12</text><text x="1159.5" y="513.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(-60 1159.5 513.5)" text-anchor="start">“TXD”</text><circle cx="1192.5" cy="576.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1192.5" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">13</text><text x="1192.5" y="606.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(60 1192.5 606.5)" text-anchor="start">“7”</text><circle cx="1192.5" cy="543.5" r="11" fill="#222222" stroke="#000" stroke-width="1.5"/><text x="1192.5" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">14</text><text x="1192.5" y="513.5" font-size="17" fill="#222222" font-weight="bold" transform="rotate(-60 1192.5 513.5)" text-anchor="start">“GND”</text><circle cx="1225.6" cy="576.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1225.6" y="580.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">15</text><text x="1225.6" y="606.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(60 1225.6 606.5)" text-anchor="start">“8”</text><circle cx="1225.6" cy="543.5" r="11" fill="#2e6fd8" stroke="#000" stroke-width="1.5"/><text x="1225.6" y="547.5" font-size="12" fill="white" text-anchor="middle" font-weight="bold">16</text><text x="1225.6" y="513.5" font-size="17" fill="#2e6fd8" font-weight="bold" transform="rotate(-60 1225.6 513.5)" text-anchor="start">“RXD”</text><text x="30" y="870" font-size="18" font-weight="bold" fill="#111">Notes</text><text x="30" y="898" font-size="16" fill="#333">“GND”: the touch board has three GND pads — one wire from each, into any GND hole.</text><text x="30" y="923" font-size="16" fill="#333">“VBUS”: one wire is enough (the second VBUS hole is a spare). Square hole = position 1.</text><text x="30" y="948" font-size="16" fill="#333">LEDs: 3 wires from the first LED (bottom right, its DIN, +5 V, GND) through the switch-plate notch, in from the FRONT.</text><text x="30" y="973" font-size="16" fill="#333">J1 is a plug, not a hole: the 5 V lead from the USB-A plug (VBUS red, GND black) ends in a JST PH housing.</text><text x="30" y="998" font-size="16" fill="#333">Never connect anything to the touch board's 3V3, VBAT, RST, 1, 2, 12, 13 pads.</text><text x="30" y="1023" font-size="16" fill="#333">Where each named pad sits on the touch board: docs/wiring-touch-board.md (the kit uses the same pads).</text></svg>